[workspace]
members = [
    "crates/typort-cli",
    "crates/typort-core",
    "crates/typort-ooxml",
    "crates/typort-math",
    "crates/typort-presets",
]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"
description = "Universal Typst to Word (.docx) converter"
repository = "https://github.com/dianzuan/typort"
homepage = "https://github.com/dianzuan/typort"

[workspace.dependencies]
# Typst ecosystem
typst = "0.15.0-rc.1"
typst-library = "0.15.0-rc.1"
typst-syntax = "0.15.0-rc.1"
typst-kit = { version = "0.15.0-rc.1", default-features = false, features = ["embedded-fonts", "scan-fonts", "system-packages", "system-downloader", "vendor-openssl"] }
typst-utils = "0.15.0-rc.1"
typst-realize = "0.15.0-rc.1"
typst-html = "0.15.0-rc.1"
typst-pdf = "0.15.0-rc.1"
typst-render = "0.15.0-rc.1"
typst-layout = "0.15.0-rc.1"

# SVG rasterization
resvg = { version = "0.45", default-features = false }
tiny-skia = "0.11"
# Pinned to the version typst-library 0.14.2 decodes rasters with, so the
# `DynamicImage` types match. Only the PNG encoder is needed (re-encoding
# already-decoded GIF/WebP/Pixel rasters to PNG).
image = { version = "0.25", default-features = false, features = ["png"] }

# OOXML generation
quick-xml = "0.37"
zip = { version = "2", default-features = false, features = ["deflate"] }

# Serialization
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# Date/time — for World::today (real local date). Already in the dependency
# tree transitively; `local-offset` enables querying the system time zone.
time = { version = "0.3", features = ["local-offset"] }

# Font name-table access — the same crate (and version) typst-library 0.14.2
# exposes via `Font::ttf()`, so the `&ttf_parser::Face` we read localized CJK
# family names from is the exact type Typst hands us (no duplicate resolved).
ttf-parser = "0.25"

# Math character classification — the same crate Typst uses, so our nary
# operand boundary (stop at a Relation-class symbol) matches Typst's own model.
unicode-math-class = "0.1"

# Math glyph styling — the same crate Typst uses to map a base letter + variant
# (bold/bb/cal/upright) to its styled Unicode codepoint (R -> ℝ, e -> 𝒆). Pinned
# to the version typst-library 0.14.2 depends on so no duplicate is resolved.
codex = "0.3"

# CLI
clap = { version = "4", features = ["derive"] }

# Internal crates
typort-core = { version = "0.1.0", path = "crates/typort-core" }
typort-ooxml = { version = "0.1.0", path = "crates/typort-ooxml" }
typort-math = { version = "0.1.0", path = "crates/typort-math" }
typort-presets = { version = "0.1.0", path = "crates/typort-presets" }

# Bibliography
hayagriva = "0.9.1"
