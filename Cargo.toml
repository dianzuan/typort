[workspace]
members = [
    "crates/typort-cli",
    "crates/typort-core",
    "crates/typort-ooxml",
    "crates/typort-math",
    "crates/typort-presets",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Typst ecosystem
typst = "0.14.2"
typst-library = "0.14.2"
typst-syntax = "0.14.2"
typst-kit = { version = "0.14.2", default-features = false, features = ["fonts", "embed-fonts", "packages", "vendor-openssl"] }
typst-utils = "0.14.2"
typst-realize = "0.14.2"
typst-html = "0.14.2"
typst-pdf = "0.14.2"

# SVG rasterization
resvg = { version = "0.45", default-features = false }
tiny-skia = "0.11"

# OOXML generation
quick-xml = "0.37"
zip = { version = "2", default-features = false, features = ["deflate"] }

# Serialization
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# CLI
clap = { version = "4", features = ["derive"] }

# Internal crates
typort-core = { path = "crates/typort-core" }
typort-ooxml = { path = "crates/typort-ooxml" }
typort-math = { path = "crates/typort-math" }
typort-presets = { path = "crates/typort-presets" }
