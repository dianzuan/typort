# Test-only preset. Real journal presets are not distributed with typort;
# supply your own `presets/<name>.toml` next to the executable or in the
# working directory and select it with `--preset <name>`.
[journal]
name = "Example Journal"

[page]
margin_top_cm = 2.54
margin_bottom_cm = 2.54
margin_left_cm = 3.17
margin_right_cm = 3.17

[footnote]
format = "circled"
